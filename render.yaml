# Render Blueprint — deploy with one click:
# https://dashboard.render.com -> New -> Blueprint -> select this repo.
# Free tier note: the instance spins down after ~15 min idle (cold start
# ~30-60s) and in-memory games are lost on restart; the disk is ephemeral so
# SQLite win stats reset on deploys. See README "Deployment".
services:
  - type: web
    name: arcade
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Supabase config — values live in the Render dashboard (sync: false),
    # never in the repo. The VITE_* ones are baked into the client during
    # buildCommand, so changing them requires a redeploy. All optional:
    # without them the arcade runs fully anonymous ("accounts not configured").
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_BASE_URL # this service's public URL, e.g. https://arcade-1628.onrender.com
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
